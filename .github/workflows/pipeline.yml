name: TV Slider build pipeline
on: push
jobs:
  build-application:
    name: Application build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 20
      - name: Install web build dependencies
        run: npm ci --prefix esp32
      - name: Build and compress web assets
        run: npm run web:build --prefix esp32
      - name: Build ESP32 application
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: 'v5.5.1'
          target: 'esp32c6'
          path: 'esp32'
        env:
          ENV_RELEASE_BUILD: 1
      - name: Determine artifact name
        id: determine_artifact_name
        run: |
          bin_path=$(find esp32/build -maxdepth 1 -name 'tv_slider-*.bin' | head -n 1)
          if [ -z "$bin_path" ]; then
            echo "No versioned binary found in esp32/build" >&2
            exit 1
          fi
          file_name=$(basename "$bin_path")
          file_postfix=${file_name#tv_slider-}
          file_postfix=${file_postfix%.bin}
          echo $file_postfix
          echo "file_postfix=$file_postfix" >> $GITHUB_OUTPUT
          find esp32/build
          
      - name: Upload application artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: esp32-firmware-${{ steps.determine_artifact_name.outputs.file_postfix }}
          path: esp32/build/tv_slider-*.{bin,elf,map}

  release:
    needs: [build-application]
    if: github.ref == 'refs/heads/master' || github.event.inputs.release == 'y'
    name: Release to Github
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4.1.7
      - name: Download artifacts
        uses: actions/download-artifact@v4.1.9
        with:
          path: esp32-firmware
      - name: Determine version
        id: determine_version
        run: |
          if [ -n "$(find esp32-firmware -name 'esp32-firmware-esp32-ide-*-dev')" ]
          then
              version=0.0.0
              file_postfix=$(find esp32-firmware -name "esp32-firmware-esp32-ide-*" | sed 's/esp32-firmware\/esp32-firmware-esp32-ide-\(.*\)/\1/')
          else
              version=$(find esp32-firmware -name "esp32-firmware-esp32-ide-*" | sed 's/esp32-firmware\/esp32-firmware-esp32-ide-\([0-9\.]*\)/\1/')
              file_postfix=$version
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "file_postfix=$file_postfix" >> $GITHUB_OUTPUT
      - name: Publish documentation
        uses: JamesIves/github-pages-deploy-action@v4.7.4
        with:
          folder: esp32-firmware/documentation
      - name: Release to Github        
        id: create_release
        uses: ncipollo/release-action@v1.16.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.determine_version.outputs.file_postfix }}
          name: v${{ steps.determine_version.outputs.file_postfix }}
          commit: ${{ github.sha }}
          draft: false
          prerelease: false
          artifacts: "esp32-firmware/esp32-firmware-esp32-ide-*/*"
