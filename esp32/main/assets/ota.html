<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OTA Update</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      .card { max-width: 520px; padding: 1.5rem; border: 1px solid #ddd; border-radius: 12px; }
      h1 { margin-top: 0; }
      code { background: #f5f5f5; padding: 0.2rem 0.35rem; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Firmware Update</h1>
      <p>Upload the <code>.bin</code> produced by <code>idf.py build</code>.</p>
      <form id="ota-form">
        <p>
          <input type="file" id="ota-file" accept=".bin" />
          <button type="submit">Upload</button>
        </p>
      </form>
      <p id="ota-status"></p>
    </div>
    <script>
      const form = document.getElementById("ota-form");
      const fileInput = document.getElementById("ota-file");
      const status = document.getElementById("ota-status");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!fileInput.files.length) {
          status.textContent = "Select a .bin file first.";
          return;
        }
        status.textContent = "Uploading...";
        const file = fileInput.files[0];
        try {
          const resp = await fetch("/update", { method: "POST", body: file });
          status.textContent = resp.ok ? "Uploaded. Rebooting..." : "Upload failed.";
        } catch (err) {
          status.textContent = "Upload failed.";
        }
      });
    </script>
  </body>
</html>
